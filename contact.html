<div class="content">
<div class="form-area">
<p class="small">Contact</p>
<h1>Message me</h1>
<p>If you wanna talk or have any question just drop it here. I'll reply when I see it.</p>

<form id="f">
<label>Name</label>
<input type="text" id="n" required>

<label>Email</label>
<input type="email" id="e" required>

<label>Your message</label>
<textarea id="m" rows="5" required></textarea>

<button type="submit">Send</button>
<p id="msg"></p>
</form>

Rohit Shaw &nbsp;|&nbsp; Shawr5104@gmail.com
</div>

<script>
document.getElementById("f").onsubmit = function(e) {
e.preventDefault();
var n = document.getElementById("n").value;
if(n) document.getElementById("msg").innerHTML = "Thanks " + n + ". Got it, will reply soon.";
this.reset();
}
</script>
