<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Rohit Shaw</title>
  <link rel="stylesheet" href="Style.css" />
</head>
<body>
  <header class="top-header">
    <nav class="top-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Projects</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="index.html#skills">Skills</a>
    </nav>
  </header>

  <main class="page-wrap contact-page">
    <section class="contact-intro">
      <p class="eyebrow">Let's connect</p>
      <h1>Contact Rohit Show</h1>
      <p>Have a project idea, a question, or an opportunity to discuss? Send a message and I will get back to you soon.</p>
    </section>

    <form class="contact-form" id="contactForm">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required />
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="form-field form-field-wide">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>
      <button class="submit-button" type="submit">Send message</button>
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>© 2026 Rohit Show</p>
    <p>Email: shawr5104@gmail.com</p>
    <p>Github: https://github.com/shawr5104-max</p>
  </footer>

<script src="reply.js"></script>
</body>
</html>
